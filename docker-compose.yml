name: marblehouse

services:
  web:
    image: marblehouse-web:latest
    container_name: marble_web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-shopmall}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-apmsetup}
    depends_on:
      - db

  db:
    image: mariadb:10.3
    container_name: marble_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-apmsetup}
      MYSQL_DATABASE: ${DB_NAME:-shopmall}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: marble_pma
    restart: always
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_PASS:-apmsetup}
    depends_on:
      - db

volumes:
  db_data:
